<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#79c9f2"><title>Sky Slide</title><style>html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:#79c9f2;touch-action:none;font-family:system-ui;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #0008}#top{position:absolute;top:max(16px,env(safe-area-inset-top));left:16px;font-weight:800}.ctl{pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;position:absolute;bottom:max(22px,env(safe-area-inset-bottom));width:92px;height:70px;border:0;border-radius:22px;background:#ffffff55;color:white;font-size:32px;backdrop-filter:blur(8px)}#l{left:18px}#r{right:18px}#fail{display:none;position:absolute;inset:0;place-items:center;background:#0007;pointer-events:auto}.card{text-align:center;background:#101828dd;padding:28px;border-radius:24px}.card button{font-size:20px;padding:14px 28px;border:0;border-radius:16px}#combo{position:absolute;top:max(58px,calc(env(safe-area-inset-top) + 42px));left:50%;transform:translateX(-50%) scale(.86);font-size:30px;font-weight:950;opacity:0;transition:opacity .16s;white-space:nowrap}#combo.show{opacity:1}#combo.bounce{animation:comboBounce .28s ease-out}@keyframes comboBounce{0%{transform:translateX(-50%) scale(.82)}45%{transform:translateX(-50%) scale(1.28)}75%{transform:translateX(-50%) scale(.96)}100%{transform:translateX(-50%) scale(1)}}#scorePops{position:absolute;inset:0;overflow:hidden}.scorePop{position:absolute;transform:translate(-50%,-50%);font-size:25px;font-weight:950;color:#fff36a;animation:scoreRise .9s ease-out forwards;white-space:nowrap}@keyframes scoreRise{0%{opacity:0;transform:translate(-50%,-35%) scale(.75)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-120%) scale(1)}}#ver{position:absolute;right:7px;top:max(7px,env(safe-area-inset-top));font:10px/1 monospace;opacity:1;color:#fff}</style></head><body><div id="app"></div><div id="hud"><div id="top">SKY SLIDE · <span id="progress">0%</span></div><div id="combo"></div><div id="scorePops"></div><div id="ver">v0.8.8</div><button class="ctl" id="l">◀</button><button class="ctl" id="r">▶</button><div id="fail"><div class="card"><h1>실패!</h1><p>재도전 할까요?</p><button id="retry">재도전</button></div></div></div><script type="module" src="/src/main.js"></script></body></html>
